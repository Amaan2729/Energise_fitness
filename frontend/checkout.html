<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout - EnerGise</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1a1f3c, #020617);
      color: #fff;
    }

    h1, h4 {
      color: #ff69b4;
      font-weight: 700;
    }

    .card-box {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 40px rgba(255,105,180,0.15);
    }

    .form-control, .form-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,105,180,0.4);
      color: #fff;
    }

    .btn-primary {
      background: #ff69b4;
      border: none;
    }
  </style>
</head>

<body>

<div class="container mt-5 mb-5">
  <h1 class="text-center mb-5">Checkout</h1>

  <div class="row g-4">

    <!-- SHIPPING -->
    <div class="col-md-7">
      <div class="card-box">

        <h4>Shipping Information</h4>

        <input id="firstName" class="form-control mb-2" placeholder="First Name">
        <input id="lastName" class="form-control mb-2" placeholder="Last Name">
        <input id="email" class="form-control mb-2" placeholder="Email">
        <input id="address" class="form-control mb-2" placeholder="Address">

        <div class="row">
          <div class="col-md-6">
            <input id="city" class="form-control mb-2" placeholder="City">
          </div>
          <div class="col-md-4">
            <input id="state" class="form-control mb-2" placeholder="State">
          </div>
          <div class="col-md-2">
            <input id="zip" class="form-control mb-2" placeholder="ZIP">
          </div>
        </div>

        <h4 class="mt-3">Payment</h4>
        <select id="paymentMethod" class="form-select">
          <option value="">Select</option>
          <option value="cash">Cash</option>
          <option value="card">Card</option>
        </select>

      </div>
    </div>

    <!-- SUMMARY -->
    <div class="col-md-5">
      <div class="card-box">
        <h4>Order Summary</h4>

        <div id="cartItems"></div>

        <hr>
        <h5>Total: ₹<span id="totalPrice">0</span></h5>

        <button id="placeOrderBtn" class="btn btn-primary w-100 mt-3">
          Place Order
        </button>
      </div>
    </div>

  </div>
</div>

<script>
/* 🔥 FIX 1: Correct backend URL */
const API_BASE = "http://localhost:5000";

/* Load cart */
const cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartBox = document.getElementById("cartItems");

let total = 0;

cart.forEach(item => {
  total += item.price * (item.quantity || 1);
  cartBox.innerHTML += `
    <div class="d-flex justify-content-between">
      <span>${item.name} x ${item.quantity || 1}</span>
      <span>₹${item.price * (item.quantity || 1)}</span>
    </div>
  `;
});

document.getElementById("totalPrice").textContent = total;

/* 🔥 FIX 2: Proper input grabbing */
document.getElementById("placeOrderBtn").onclick = async () => {

  if (!cart.length) {
    alert("Cart is empty");
    return;
  }

  const order = {
    firstName: document.getElementById("firstName").value,
    lastName: document.getElementById("lastName").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    city: document.getElementById("city").value,
    state: document.getElementById("state").value,
    zip: document.getElementById("zip").value,
    paymentMethod: document.getElementById("paymentMethod").value,
    products: cart,
    totalPrice: total
  };

  try {
    const res = await fetch(`${API_BASE}/api/orders`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + (localStorage.getItem("token") || "")
      },
      body: JSON.stringify(order)
    });

    const data = await res.json();

    if (res.ok) {
      alert("✅ Order placed successfully");
      localStorage.removeItem("cart");
      window.location.href = "index.html";
    } else {
      alert("❌ " + data.message);
    }

  } catch (err) {
    console.error(err);
    alert("❌ Server error");
  }
};
</script>

</body>
</html>
