<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="assets/css/common.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - EnerGise</title>

  <!-- Bootstrap -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css"
  />

  <!-- Google Font -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    :root {
      --primary-color: #ff69b4;
      --secondary-color: #9c27b0;
      --dark-bg: #0a0e27;
      --text-color: #ffffff;
      --text-muted: #b0b8d4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family: 'Poppins', sans-serif;

      background:
      linear-gradient(
        135deg,
        var(--dark-bg) 0%,
        #1a1f3a 50%,
        var(--dark-bg) 100%
      );

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      position: relative;
    }

    body::before {

      content: '';

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
      radial-gradient(circle at 20% 50%,
      rgba(255, 105, 180, 0.1) 0%,
      transparent 50%),

      radial-gradient(circle at 80% 80%,
      rgba(156, 39, 176, 0.1) 0%,
      transparent 50%);

      z-index: -1;
    }

    .login-wrapper {

      width: 100%;
      max-width: 450px;

      padding: 20px;
    }

    .login-container {

      background: rgba(15, 23, 42, 0.8);

      backdrop-filter: blur(10px);

      border: 1px solid rgba(255, 105, 180, 0.2);

      border-radius: 20px;

      padding: 2.5rem;

      box-shadow:
      0 25px 50px rgba(0, 0, 0, 0.5),
      0 0 100px rgba(255, 105, 180, 0.1);

      animation: slideInUp 0.6s ease-out;
    }

    @keyframes slideInUp {

      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {

      text-align: center;

      margin-bottom: 2rem;
    }

    .login-header h2 {

      color: var(--text-color);

      font-weight: 700;

      font-size: 2rem;

      margin-bottom: 0.5rem;

      background:
      linear-gradient(
        135deg,
        var(--primary-color) 0%,
        var(--secondary-color) 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-header p {

      color: var(--text-muted);

      font-size: 0.95rem;
    }

    .form-group {

      margin-bottom: 1.5rem;
    }

    .form-label {

      color: var(--text-color);

      font-weight: 600;

      margin-bottom: 0.7rem;

      display: block;
    }

    .form-control {

      background: rgba(255,255,255,0.05);

      border: 1.5px solid rgba(255, 105, 180, 0.2);

      color: var(--text-color);

      padding: 0.9rem 1rem;

      border-radius: 10px;

      transition: 0.3s ease;
    }

    .form-control::placeholder {

      color: var(--text-muted);
    }

    .form-control:focus {

      background: rgba(255,255,255,0.08);

      border-color: var(--primary-color);

      box-shadow:
      0 0 20px rgba(255, 105, 180, 0.3);

      color: var(--text-color);
    }

    .btn-login {

      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 0.95rem;

      background:
      linear-gradient(
        135deg,
        var(--primary-color) 0%,
        var(--secondary-color) 100%
      );

      color: white;

      font-weight: 700;

      margin-top: 0.5rem;

      transition: 0.3s ease;

      box-shadow:
      0 10px 30px rgba(255, 105, 180, 0.3);
    }

    .btn-login:hover {

      transform: translateY(-3px);

      box-shadow:
      0 15px 40px rgba(255, 105, 180, 0.4);

      color: white;
    }

    .form-footer {

      display: flex;
      flex-direction: column;

      gap: 1rem;

      margin-top: 1.5rem;
    }

    .form-footer a {

      color: var(--primary-color);

      text-decoration: none;
    }

    .form-footer a:hover {

      text-decoration: underline;
    }

    .forgot-password-link,
    .signup-link {

      text-align: center;
    }

    .signup-link {

      color: var(--text-muted);
    }

    #message {

      margin-top: 1.5rem;
    }

    .alert {

      border-radius: 10px;
    }

    @media (max-width: 768px) {

      .login-container {

        padding: 2rem;
      }

      .login-header h2 {

        font-size: 1.6rem;
      }
    }

  </style>

</head>

<body>

  <div class="login-wrapper">

    <div class="login-container">

      <!-- Header -->

      <div class="login-header">

        <h2>💪 Welcome Back</h2>

        <p>Login to your EnerGise account</p>

      </div>

      <!-- Login Form -->

      <form id="loginForm">

        <!-- Email -->

        <div class="form-group">

          <label for="email" class="form-label">
            📧 Email Address
          </label>

          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
            required
          >

        </div>

        <!-- Password -->

        <div class="form-group">

          <label for="password" class="form-label">
            🔐 Password
          </label>

          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
            required
          >

        </div>

        <!-- Button -->

        <button type="submit" class="btn btn-login">

          🚀 Login

        </button>

        <!-- Footer -->

        <div class="form-footer">

          <div class="forgot-password-link">

            <a href="#">
              Forgot your password?
            </a>

          </div>

          <div class="signup-link">

            Don't have an account?

            <a href="signup.html">
              Sign Up Now
            </a>

          </div>

        </div>

      </form>

      <!-- Message -->

      <div id="message"></div>

    </div>

  </div>

  <!-- Bootstrap -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

  <!-- Login Script -->

  <script>

    /* =========================
       BACKEND URL
    ========================= */

    const API_BASE = "http://localhost:5000";

    /* =========================
       ADMIN CREDENTIALS
    ========================= */

    const ADMIN_EMAIL = "admin@energise.com";

    const ADMIN_PASSWORD = "admin123";

    /* =========================
       LOGIN FORM
    ========================= */

    document
    .getElementById("loginForm")

    .addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
      document.getElementById("email").value.trim();

      const password =
      document.getElementById("password").value;

      const messageDiv =
      document.getElementById("message");

      /* =========================
         ADMIN LOGIN
      ========================= */

      if (

        email === ADMIN_EMAIL &&
        password === ADMIN_PASSWORD

      ) {

        messageDiv.innerHTML =

        `
        <div class="alert alert-success">

          ✅ Admin Login Successful

        </div>
        `;

        /* Save Admin Session */

        localStorage.setItem("adminId", "admin");

        localStorage.setItem(
          "adminPassword",
          "admin123"
        );

        localStorage.setItem(
          "adminLoginTime",
          Date.now()
        );

setTimeout(() => {

    window.location.href =
    "admin-dashboard.html";

}, 700);

        return;
      }

      /* =========================
         NORMAL USER LOGIN
      ========================= */

      try {

        const res = await fetch(

          `${API_BASE}/api/users/login`,

          {

            method: "POST",

            headers: {

              "Content-Type":
              "application/json"
            },

            body: JSON.stringify({

              email,
              password

            })

          }
        );

        const data = await res.json();

        if (res.ok) {

          messageDiv.innerHTML =

          `
          <div class="alert alert-success">

            ✅ ${data.message}

          </div>
          `;

          /* Save Token */

          localStorage.setItem(
            "token",
            data.token
          );

          /* Read Params */

          const params =
          new URLSearchParams(
            window.location.search
          );

          const next =
          params.get("next");

          const plan =
          params.get("plan");
          const redirectPage =
localStorage.getItem(
    "redirectAfterLogin"
);

if (redirectPage) {

    localStorage.removeItem(
        "redirectAfterLogin"
    );

    window.location.href =
    redirectPage;

    return;
}

          setTimeout(() => {

            /* Redirect From Subscription */

            if (next === "subscription") {

              const target = plan

              ? `subscription.html?plan=${encodeURIComponent(plan)}`

              : "subscription.html";

              window.location.href =
              target;

              return;
            }

            /* Normal Redirect */

            window.location.href =
            "subscription.html";

          }, 700);

        }

        else {

          messageDiv.innerHTML =

          `
          <div class="alert alert-danger">

            ❌ ${data.message}

          </div>
          `;
        }

      }

      catch (err) {

        console.error(err);

        messageDiv.innerHTML =

        `
        <div class="alert alert-danger">

          ❌ Server error.
          Please try again later.

        </div>
        `;
      }

    });

  </script>

</body>
</html>
